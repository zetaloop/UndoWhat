[package]
name = "undowhat"
version = "0.1.0"
edition = "2024"

[lib]
name = "undowhat_hook"
crate-type = ["cdylib"]

[dependencies]
minhook = "0.9.0"
windows = { version = "0.62.2", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_Security"] }
